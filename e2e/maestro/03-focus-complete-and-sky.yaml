appId: com.stillsky
name: Completing a 1-minute session lights the first star
tags: [slow]
---
- runFlow: common/fresh-start.yaml
- tapOn: { id: tabs.sky, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: sky.emptyState }
- tapOn: { id: tabs.focus, waitToSettleTimeoutMs: 500 }
- tapOn: { id: focus.duration.1, waitToSettleTimeoutMs: 500 }
- tapOn: { id: focus.startButton, waitToSettleTimeoutMs: 500 }
- extendedWaitUntil:
    visible: { id: focus.completedMessage }
    timeout: 75000
- tapOn: { id: focus.viewInSkyButton, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: sky.litCount, text: "1 star lit" }
- tapOn: { id: sky.constellation.littleDipper, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: sky.cardName, text: "Little Dipper" }
- assertVisible: { id: sky.cardProgress, text: "1/7 stars" }
- assertVisible: { id: sky.cardDate, text: "In progress" }
- tapOn: { id: sky.cardClose, waitToSettleTimeoutMs: 500 }
- assertNotVisible: { id: sky.card }
