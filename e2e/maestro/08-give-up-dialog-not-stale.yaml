appId: com.stillsky
name: A Give-up dialog left open when the session completes does not reappear
tags: [slow]
---
- runFlow: common/fresh-start.yaml
- tapOn: { id: focus.duration.1, waitToSettleTimeoutMs: 500 }
- tapOn: { id: focus.startButton, waitToSettleTimeoutMs: 500 }
- tapOn: { id: focus.giveUpButton, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: dialog.message }
# leave the dialog open until the session finishes on its own
- extendedWaitUntil:
    visible: { id: focus.completedMessage }
    timeout: 75000
- tapOn: { id: focus.doneButton, waitToSettleTimeoutMs: 500 }
- tapOn: { id: focus.startButton, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: focus.timerText }
- assertNotVisible: { id: dialog.message }
