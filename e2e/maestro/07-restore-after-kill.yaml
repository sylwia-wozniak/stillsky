appId: com.stillsky
name: A session that ended while the app was killed counts as completed
tags: [slow]
---
- runFlow: common/fresh-start.yaml
- tapOn: { id: focus.duration.1, waitToSettleTimeoutMs: 500 }
- tapOn: { id: focus.startButton, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: focus.timerText }
- stopApp
- runFlow: common/wait-70s.yaml
- launchApp
- assertVisible: { id: focus.startButton }
- assertNotVisible: { id: focus.timerText }
- tapOn: { id: tabs.sky, waitToSettleTimeoutMs: 500 }
- assertVisible: { id: sky.litCount, text: "1 star lit" }
