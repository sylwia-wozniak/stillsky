appId: com.stillsky
name: Seeded demo data fills Sky and Stats (test builds only)
tags: [smoke, debug-only]
---
- runFlow: common/fresh-start.yaml
- tapOn: { id: tabs.settings, waitToSettleTimeoutMs: 500 }
- tapOn: { id: settings.seedButton, waitToSettleTimeoutMs: 500 }
- tapOn: { id: tabs.sky, waitToSettleTimeoutMs: 500 }
- assertNotVisible: { id: sky.emptyState }
- assertVisible: { id: sky.constellation.littleDipper }
- tapOn: { id: tabs.stats, waitToSettleTimeoutMs: 500 }
- tapOn: { id: stats.period.month, waitToSettleTimeoutMs: 500 }
- assertNotVisible: { id: stats.emptyState }
- assertVisible: { id: stats.totalTime }
